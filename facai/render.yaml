services:
  - type: web
    name: facai-workbench
    runtime: docker
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    # 持久磁盘：发货数据存这里，重启/重新部署都不丢
    disks:
      - name: facai-data
        mountPath: /app/data
        sizeGB: 1
    envVars:
      - key: PORT
        value: "3001"
      - key: NODE_ENV
        value: production
